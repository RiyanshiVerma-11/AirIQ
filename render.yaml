# ─────────────────────────────────────────────────────────────
# Render Blueprint Specification for AirIQ
# https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────

services:
  # Static Site Deployment (Recommended: Fast, Free, Global CDN)
  - type: web
    name: airiq-cleanair
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
